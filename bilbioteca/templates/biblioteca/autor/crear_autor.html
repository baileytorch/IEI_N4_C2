{% extends 'base.html' %}

{% block titulo %}
<title>Creación de Autor</title>
{% endblock %}

{% block contenido %}
<div class="row">
    <div class="col">
        <h3>Agregar Autor</h3>
    </div>
</div>
<br>

<div class="row">
    <form action="" method="post">
        {% csrf_token %}
        <div class="row">
            <div class="col">
                <label for="nombre" class="form-label">Nombre Autor:</label>
                <input type="text" name="nombre" id="nombre" placeholder="Nombre Autor..." class="form-control">
            </div>

            <div class="col">
                <label for="pseudonimo" class="form-label">Pseudónimo Autor:</label>
                <input type="text" name="pseudonimo" id="pseudonimo" placeholder="Pseudónimo Autor..."
                    class="form-control">
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col-4">
                <label for="nacionalidad" class="form-label">Nacionalidad:</label>
                <select name="nacionalidad" id="nacionalidad" class="form-select">
                    <option value="">Seleccione Nacionalidad</option>
                    {% for pais in paises %}
                    <option value="{{ pais.id }}">{{ pais.nombre }} - {{ pais.nacionalidad }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="col-4">
                <label for="fecha_nacimiento" class="form-label">Fecha Nacimiento:</label>
                <input type="date" name="fecha_nacimiento" id="fecha_nacimiento" class="form-control">
            </div>

            <div class="col-4">
                <label for="fecha_defuncion" class="form-label">Fecha Defunción:</label>
                <input type="date" name="fecha_defuncion" id="fecha_defuncion" class="form-control">
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <label for="biografia" class="form-label">Biografía:</label>
                <textarea rows="5" type="text" name="biografia" id="biografia" class="form-control"></textarea> 
            </div>
        </div>
        <br>

        <div class="row">
            <div class="col">
                <input type="submit" value="Guardar" class="btn btn-primary">
            </div>
        </div>
    </form>
</div>
{% endblock %}

{% block scritp %}
<script>
</script>
{% endblock %}
